# llama-swap 配置 —— 小焦多大脑热切换
# llama-swap 监听 8080，按 model 名把请求路由到对应 upstream(动态端口 ${PORT})，按需加载/卸载 → 秒级切换、省显存。
models:
  xiaojiao:
    cmd: C:/llama/llama-server.exe --port ${PORT} --model C:/llama/xiaojiao1.0-4B.gguf -c 32768
    ttl: 0               # 不自动卸载(由小焦/视频切换时主动 unload)
    useModelName: xiaojiao1.0-4B
  # 未来可加更多大脑(填进 models 即可被调度):
  # deepseek:
  #   cmd: ... --port ${PORT} --model <deepseek.gguf>
  #   ttl: 0
